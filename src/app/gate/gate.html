<div class="gate">
  <form class="card" autocomplete="off" (submit)="submit($event, pw.value)">
    <div class="crown">👑</div>
    <input
      #pw
      type="password"
      inputmode="text"
      placeholder="hasło"
      autocomplete="off"
      autofocus
      (input)="error.set(false)"
    />
    <button type="submit">Wejdź</button>
    @if (error()) {
      <p class="err">Niepoprawne hasło</p>
    }
  </form>
</div>
